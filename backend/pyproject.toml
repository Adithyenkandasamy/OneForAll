[project]
name = "oneforall-backend"
version = "0.1.0"
description = "AI-first Manufacturing Intelligence Platform - Modular Monolith"
requires-python = ">=3.10,<3.14"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.52.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.5.2",
    "sqlalchemy==2.0.35",
    "supabase==2.31.0",
    "python-jose[cryptography]==3.3.0",
    "bcrypt==3.2.0",
    "python-multipart==0.0.9",
    "httpx==0.27.2",
    "mcp==1.29.0",
    "groq==1.6.0",
    "asyncpg==0.31.0",
    "email-validator==2.3.0",
    "python-dotenv==1.2.2",
    "anyio==4.14.2",
    "starlette==0.38.6",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "aiosqlite==0.22.1",
    "ruff==0.16.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: FastAPI's Depends()/Query() in default args is the idiomatic pattern.
ignore = ["B008"]
